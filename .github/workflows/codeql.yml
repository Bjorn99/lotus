name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, Monday 06:17 UTC. Off-peak slot to avoid the top-of-hour rush
    # on GitHub-hosted runners.
    - cron: "17 6 * * 1"

jobs:
  analyze:
    name: Analyze (kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # CodeQL's bundled Kotlin extractor lags new Kotlin releases. Without this
    # flag it aborts the run with "kotlin-version-too-new" whenever the project
    # moves past the extractor's supported ceiling (e.g. the 2.4.0 -> 2.4.10
    # bump). Allowing unsupported versions lets the extractor analyze anyway.
    # Worst case is slightly reduced extractor precision on the newest language
    # features — never a build or security regression — and it keeps the job
    # green across future Kotlin upgrades instead of one-off pinning.
    env:
      CODEQL_EXTRACTOR_KOTLIN_ALLOW_UNSUPPORTED: "true"
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # Default queries are fine; security-extended adds a few more passes
          # that are worth the extra minutes for an Android app.
          queries: security-extended

      - name: Build (autobuild fails on Android, so use Gradle directly)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
