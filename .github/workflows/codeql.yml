name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, Monday 06:17 UTC. Off-peak slot to avoid the top-of-hour rush
    # on GitHub-hosted runners.
    - cron: "17 6 * * 1"

jobs:
  analyze:
    name: Analyze (kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # CodeQL's bundled Kotlin extractor has a hard version ceiling: a literal
    # list in java/kotlin-extractor/versions.bzl in the github/codeql repo.
    # Past it the extractor rejects the build with KotlinVersionTooRecentError
    # and the flag below does NOT bypass that — measured 2026-09-23, when
    # Kotlin 2.4.20 hard-failed with the flag already set.
    #
    # What unblocks a Kotlin bump is a codeql-action release whose
    # src/defaults.json names a bundle containing the new version. init@v4
    # reads defaults.json from whatever v4 release is current, so the bundle
    # does not float on its own. Kotlin 2.4.20 failed on bundle 2.27.0
    # (action 4.38.1) and passed on 2.27.1 (action 4.38.2), which is the
    # release that added "2.4.20" to that list.
    #
    # The flag stays set, but do not rely on it: in the one case measured here
    # it changed nothing. Whether to remove it is a separate question that
    # nobody has evidence on either way.
    env:
      CODEQL_EXTRACTOR_KOTLIN_ALLOW_UNSUPPORTED: "true"
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # Default queries are fine; security-extended adds a few more passes
          # that are worth the extra minutes for an Android app.
          queries: security-extended

      - name: Build (autobuild fails on Android, so use Gradle directly)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
